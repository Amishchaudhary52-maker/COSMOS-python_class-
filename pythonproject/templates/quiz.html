<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IOE Model Question</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .question h3 {
            margin-top: 0;
        }

        .option {
            display: block;
            margin: 12px 0;
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 5px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #e8f0fe;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Model Question</h1>

 <form action="/submit" method="POST">

    {% for q in questions %}

    {% set question_number = loop.index0 %}

    <div class="question">

        <h3>
            {{ loop.index }}. {{ q.question }}
        </h3>

        {% for option in q.options %}

        <label class="option">

            <input
                 type="radio"
                name="q{{ question_number }}"
                value="{{ option[0] }}"
                required
            >

            {{ option }}

        </label>

        {% endfor %}

    </div>

    {% endfor %}

    <button type="submit">Submit Quiz</button>

</form>


</div>

</body>
</html>
